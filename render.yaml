services:
  - type: web
    name: last30days
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --timeout 360 --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: SCRAPECREATORS_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: PARALLEL_API_KEY
        sync: false
      - key: BRAVE_API_KEY
        sync: false
      - key: APIFY_API_TOKEN
        sync: false
      - key: AUTH_TOKEN
        sync: false
      - key: CT0
        sync: false
      - key: BSKY_HANDLE
        sync: false
      - key: BSKY_APP_PASSWORD
        sync: false
      - key: TRUTHSOCIAL_TOKEN
        sync: false
